name: Deploy to Server ZeroYz

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Tailscale via apt
      run: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /etc/apt/keyrings/tailscale-archive-keyring.gpg >/dev/null
        curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
        sudo apt-get update
        sudo apt-get install -y tailscale
        sudo tailscale up --oauth-client-id=${{ secrets.TS_OAUTH_CLIENT_ID }} --oauth-secret=${{ secrets.TS_OAUTH_SECRET }} --tags=tag:ci
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /home/${{ secrets.SERVER_USER }}/SzBot
          echo "Start run"
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt --quiet
          sudo systemctl restart zeroyzbot
          echo "✅ OK"